<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cugo 학습 대시보드</title>
<style>
:root {
  color-scheme: light;
  --plane: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --accent-wash: rgba(42, 120, 214, 0.10);
  --good: #0ca30c;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.04), 0 4px 16px rgba(11, 11, 11, 0.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --plane: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --accent-wash: rgba(57, 135, 229, 0.16);
    --shadow: none;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--plane);
  color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 24px;
  padding: 0 24px; height: 56px;
  background: color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand b { font-size: 16px; letter-spacing: -0.01em; }
.brand span { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--surface-2); }
.tabs button {
  border: 0; background: none; padding: 5px 14px; border-radius: 7px;
  color: var(--ink-2); cursor: pointer; font-weight: 500;
}
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 16px; min-width: 0; }
.gpu { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.gpu .name { color: var(--ink); font-weight: 500; }
.meter { width: 64px; height: 6px; border-radius: 3px; background: var(--accent-wash); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--series-1); border-radius: 3px; transition: width .4s; }
.updated { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- layout ---------- */
main { max-width: 1440px; margin: 0 auto; padding: 24px; }
.train { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; align-items: start; }
.runs { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 4px; max-height: calc(100vh - 104px); overflow: auto; }
.runs h2, .section-title { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 8px 10px; }
.run-item {
  display: grid; grid-template-columns: 1fr auto; gap: 2px 8px;
  width: 100%; text-align: left; border: 0; background: none; cursor: pointer;
  padding: 10px 12px; border-radius: 10px;
}
.run-item:hover { background: var(--surface-2); }
.run-item[aria-current="true"] { background: var(--surface); box-shadow: var(--shadow), inset 0 0 0 1px var(--border); }
.run-item .rn { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-item .rm { grid-column: 1 / -1; font-size: 12px; color: var(--muted); display: flex; gap: 8px; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow); padding: 20px;
}
.detail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.run-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.run-head h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0; overflow-wrap: anywhere; }
.run-sub { color: var(--muted); font-size: 13px; width: 100%; margin-top: -6px; overflow-wrap: anywhere; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); font-weight: 500; }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status.running .dot { background: var(--good); box-shadow: 0 0 0 0 var(--good); animation: pulse 1.6s infinite; }
.status.done .dot { background: var(--series-1); }
.status.stopped .dot { background: var(--warning); }
.status.failed .dot { background: var(--critical); }
@keyframes pulse { 70% { box-shadow: 0 0 0 6px transparent; } }

.progress { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.progress .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--accent-wash); overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--series-1); border-radius: 3px; }

.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert {
  display: grid; grid-template-columns: 20px 1fr; gap: 2px 10px; align-items: start;
  padding: 12px 14px; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--border); border-left: 3px solid var(--sev);
}
.alert svg { color: var(--sev); margin-top: 2px; }
.alert b { font-weight: 600; }
.alert p { grid-column: 2; margin: 0; color: var(--ink-2); font-size: 13px; }
.alert .sev { font-size: 11px; font-weight: 600; color: var(--ink-2); margin-left: 8px; letter-spacing: .02em; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { padding: 16px 18px; }
.tile .label { font-size: 13px; color: var(--ink-2); }
.tile .value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; }
.tile .note { font-size: 12px; color: var(--muted); margin-top: 2px; }

.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.chart-card { padding: 16px 16px 8px; position: relative; }
.chart-card h3 { margin: 0; font-size: 14px; font-weight: 600; }
.chart-card .csub { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; min-height: 40px; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; justify-content: flex-end; }
.legend span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.key { display: inline-block; width: 14px; height: 2px; border-radius: 1px; background: var(--c); }
.plot { position: relative; margin-top: 8px; outline: none; }
.plot svg { display: block; width: 100%; overflow: visible; }
.plot:focus-visible { box-shadow: 0 0 0 2px var(--series-1); border-radius: 6px; }
.tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.endlabel { fill: var(--ink-2); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tip {
  position: absolute; pointer-events: none; z-index: 5; min-width: 120px;
  padding: 8px 10px; border-radius: 10px; font-size: 12px;
  background: var(--surface); border: 1px solid var(--border);
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
}
.tip .th { color: var(--muted); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.tip .tr { display: flex; align-items: center; gap: 8px; }
.tip .tr strong { font-variant-numeric: tabular-nums; }
.tip .tr span:last-child { color: var(--ink-2); }
.explore select, .eval-sort select {
  padding: 4px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2);
  max-width: 220px;
}

.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; margin: 12px 0 0; }
.kv dt { color: var(--muted); overflow-wrap: anywhere; }
.kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.scroll { overflow-x: auto; margin: 12px -4px 0; }
.empty { color: var(--muted); padding: 32px; text-align: center; }

/* ---------- evals ---------- */
.evals { display: flex; flex-direction: column; gap: 16px; }
.eval-intro h1 { font-size: 22px; letter-spacing: -0.02em; margin: 0 0 4px; }
.eval-intro p { margin: 0; color: var(--ink-2); max-width: 760px; }
.forest { display: grid; grid-template-columns: minmax(150px, 280px) minmax(0, 1fr) 132px; column-gap: 16px; margin-top: 12px; }
.forest .fl { padding: 10px 0; font-size: 13px; min-width: 0; }
.forest .fl b { display: block; font-weight: 500; overflow-wrap: anywhere; }
.forest .fl small { color: var(--muted); font-size: 12px; }
.forest .ft { position: relative; border-bottom: 1px solid var(--grid); }
.forest .fv { padding: 10px 0; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--grid); }
.forest .fl { border-bottom: 1px solid var(--grid); }
.forest .fv small { display: block; color: var(--muted); font-size: 12px; }
.zero { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--axis); }
.gridline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--grid); }
.whisker { position: absolute; top: 50%; height: 2px; margin-top: -1px; border-radius: 1px; background: var(--c); }
.pt {
  position: absolute; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
  background: var(--c); box-shadow: 0 0 0 2px var(--surface);
}
.forest .axis { position: relative; height: 24px; grid-column: 2; }
.forest .axis span { position: absolute; transform: translateX(-50%); font-size: 11px; color: var(--muted); top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.forest .axis-label { grid-column: 2; text-align: center; font-size: 12px; color: var(--muted); }
.verdict { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.verdict i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }

@media (max-width: 1100px) {
  .charts, .split { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .top { padding: 0 16px; gap: 12px; height: auto; min-height: 56px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
  .brand span, .gpu .name, .gpu .extra { display: none; }
  .top-right { margin-left: 0; width: 100%; justify-content: space-between; }
  main { padding: 16px; }
  .train { grid-template-columns: minmax(0, 1fr); }
  .runs { position: static; flex-direction: row; overflow-x: auto; max-height: none; padding-bottom: 4px; }
  .runs h2 { display: none; }
  .run-item { min-width: 200px; }
  .forest { grid-template-columns: minmax(0, 1fr) 96px; }
  .forest .fl { grid-column: 1 / -1; border-bottom: 0; padding-bottom: 0; }
  .forest .ft { grid-column: 1; min-height: 36px; }
  .forest .axis, .forest .axis-label { grid-column: 1; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Cugo</b><span>학습 대시보드</span></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="train" aria-selected="true">학습</button>
    <button role="tab" data-tab="evals" aria-selected="false">평가</button>
  </nav>
  <div class="top-right">
    <div class="gpu" id="gpu"></div>
    <div class="updated" id="updated">불러오는 중…</div>
  </div>
</header>

<main>
  <section class="train" id="view-train">
    <nav class="runs" id="runs" aria-label="학습 로그"></nav>
    <div class="detail" id="detail"><div class="card empty">학습 로그를 불러오는 중…</div></div>
  </section>
  <section class="evals" id="view-evals" hidden></section>
</main>

<script>
"use strict";

// ---------- helpers ----------
const $ = (sel) => document.querySelector(sel);
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}
const SVGNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, text) {
  const el = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) el.setAttribute(k, v);
  if (text != null) el.textContent = text;
  return el;
}
const store = {
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

const compactFmt = new Intl.NumberFormat("ko-KR", { notation: "compact", maximumFractionDigits: 2 });
const intFmt = new Intl.NumberFormat("ko-KR");
function smart(v) {
  if (v == null || !isFinite(v)) return "–";
  const a = Math.abs(v);
  if (a >= 100000) return compactFmt.format(v);
  if (a >= 1000) return intFmt.format(Math.round(v));
  if (a === 0) return "0";
  if (a >= 100) return v.toFixed(1);
  if (a >= 1) return v.toFixed(3).replace(/\.?0+$/, "");
  return Number(v.toPrecision(3)).toString();
}
const FORMATS = {
  smart,
  compact: (v) => (v == null ? "–" : compactFmt.format(v)),
  pct01: (v) => (v == null ? "–" : (v * 100).toFixed(1) + "%"),
  pct: (v) => (v == null ? "–" : v.toFixed(v < 1 ? 2 : 1) + "%"),
};
function ago(ts, now) {
  const d = Math.max(0, now - ts);
  if (d < 45) return "방금";
  if (d < 3600) return Math.round(d / 60) + "분 전";
  if (d < 86400) return Math.round(d / 3600) + "시간 전";
  return Math.round(d / 86400) + "일 전";
}
function duration(sec) {
  sec = Math.round(sec);
  const hh = Math.floor(sec / 3600), mm = Math.floor((sec % 3600) / 60), ss = sec % 60;
  if (hh) return `${hh}시간 ${mm}분`;
  if (mm) return `${mm}분 ${ss}초`;
  return `${ss}초`;
}
const STATUS_LABEL = { running: "학습 중", done: "완료", stopped: "중단됨", failed: "실패" };
const statusBadge = (st) => h("span", { class: "status " + st }, h("span", { class: "dot" }), STATUS_LABEL[st] || st);

// ---------- chart ----------
function niceStep(range, count) {
  const raw = range / count;
  const p = 10 ** Math.floor(Math.log10(raw));
  const n = raw / p;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
}
function niceScale(min, max, count) {
  if (min === max) { const pad = Math.abs(min) * 0.1 || 1; min -= pad; max += pad; }
  const step = niceStep(max - min, count);
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let t = lo; t <= hi + step / 2; t += step) ticks.push(+t.toPrecision(12));
  return { lo, hi, ticks };
}

function lineChart(card, cfg) {
  const plot = card.querySelector(".plot");
  plot.replaceChildren();
  const W = Math.max(240, plot.clientWidth), H = 196;
  const M = { l: 52, r: 58, t: 10, b: 24 };
  const xs = cfg.x;
  const fmt = FORMATS[cfg.fmt || "smart"];
  const tickFmt = cfg.fmt ? fmt : (t) => (Math.abs(t) >= 100000 ? compactFmt.format(t) : String(+t.toPrecision(6)));
  const all = cfg.series.flatMap((sr) => sr.values).filter((v) => v != null && isFinite(v));
  if (!xs.length || !all.length) { plot.append(h("div", { class: "empty" }, "데이터 없음")); return; }
  const y = niceScale(Math.min(...all), Math.max(...all), 4);
  const x0 = xs[0], x1 = xs[xs.length - 1] === x0 ? x0 + 1 : xs[xs.length - 1];
  const X = (v) => M.l + ((v - x0) / (x1 - x0)) * (W - M.l - M.r);
  const Y = (v) => M.t + (1 - (v - y.lo) / (y.hi - y.lo)) * (H - M.t - M.b);
  const svg = s("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": cfg.title });

  for (const t of y.ticks) {
    svg.append(s("line", { x1: M.l, x2: W - M.r, y1: Y(t), y2: Y(t), stroke: "var(--grid)", "stroke-width": 1, "shape-rendering": "crispEdges" }));
    svg.append(s("text", { x: M.l - 8, y: Y(t) + 4, "text-anchor": "end", class: "tick" }, tickFmt(t)));
  }
  const xt = niceScale(x0, x1, Math.max(2, Math.floor((W - M.l - M.r) / 90)));
  for (const t of xt.ticks) if (t >= x0 && t <= x1)
    svg.append(s("text", { x: X(t), y: H - 6, "text-anchor": "middle", class: "tick" }, intFmt.format(t)));

  const ends = [];
  cfg.series.forEach((sr) => {
    let d = "", pen = false, last = -1;
    sr.values.forEach((v, i) => {
      if (v == null || !isFinite(v)) { pen = false; return; }
      d += (pen ? "L" : "M") + X(xs[i]).toFixed(1) + " " + Y(v).toFixed(1);
      pen = true; last = i;
    });
    svg.append(s("path", { d, fill: "none", stroke: sr.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    if (last >= 0) ends.push({ sr, i: last, y: Y(sr.values[last]) });
  });
  // End labels only when they cannot collide; otherwise legend + tooltip carry identity.
  const spaced = ends.every((a, i) => ends.every((b, j) => i === j || Math.abs(a.y - b.y) >= 14));
  for (const e of ends) {
    svg.append(s("circle", { cx: X(xs[e.i]), cy: e.y, r: 4, fill: e.sr.color, stroke: "var(--surface)", "stroke-width": 2 }));
    if (spaced) svg.append(s("text", { x: X(xs[e.i]) + 8, y: e.y + 4, class: "endlabel" }, fmt(e.sr.values[e.i])));
  }

  const cross = s("line", { y1: M.t, y2: H - M.b, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
  const dots = cfg.series.map((sr) => s("circle", { r: 4, fill: sr.color, stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" }));
  svg.append(cross, ...dots);
  const hit = s("rect", { x: M.l, y: 0, width: W - M.l - M.r, height: H, fill: "transparent" });
  svg.append(hit);
  plot.append(svg);

  const tip = h("div", { class: "tip", hidden: true });
  plot.append(tip);
  let idx = -1;
  function show(i) {
    idx = Math.max(0, Math.min(xs.length - 1, i));
    const px = X(xs[idx]);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
    tip.replaceChildren(h("div", { class: "th" }, "iter " + intFmt.format(xs[idx])));
    cfg.series.forEach((sr, k) => {
      const v = sr.values[idx];
      const ok = v != null && isFinite(v);
      dots[k].setAttribute("visibility", ok ? "visible" : "hidden");
      if (ok) { dots[k].setAttribute("cx", px); dots[k].setAttribute("cy", Y(v)); }
      tip.append(h("div", { class: "tr" }, h("i", { class: "key", style: `--c:${sr.color}` }), h("strong", {}, fmt(v)), h("span", {}, sr.name)));
    });
    tip.hidden = false;
    const scale = plot.clientWidth / W;
    const left = px * scale, tw = tip.offsetWidth;
    tip.style.left = (left + 14 + tw > plot.clientWidth ? left - tw - 14 : left + 14) + "px";
    tip.style.top = "8px";
  }
  function hide() {
    tip.hidden = true; cross.setAttribute("visibility", "hidden");
    dots.forEach((d) => d.setAttribute("visibility", "hidden"));
  }
  function nearest(clientX) {
    const r = svg.getBoundingClientRect();
    const vx = ((clientX - r.left) / r.width) * W;
    const target = x0 + ((vx - M.l) / (W - M.l - M.r)) * (x1 - x0);
    let lo = 0, hi = xs.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (xs[mid] < target) lo = mid; else hi = mid; }
    return Math.abs(xs[lo] - target) <= Math.abs(xs[hi] - target) ? lo : hi;
  }
  hit.addEventListener("pointermove", (e) => show(nearest(e.clientX)));
  hit.addEventListener("pointerleave", hide);
  plot.tabIndex = 0;
  plot.onfocus = () => show(idx < 0 ? xs.length - 1 : idx);
  plot.onblur = hide;
  plot.onkeydown = (e) => {
    const step = e.shiftKey ? Math.ceil(xs.length / 20) : 1;
    if (e.key === "ArrowLeft") { show(idx - step); e.preventDefault(); }
    if (e.key === "ArrowRight") { show(idx + step); e.preventDefault(); }
  };
}

function chartCard(cfg, extraHead) {
  const legend = cfg.series.length >= 2
    ? h("div", { class: "legend" }, cfg.series.map((sr) => h("span", {}, h("i", { class: "key", style: `--c:${sr.color}` }), sr.name)))
    : null;
  const card = h("div", { class: "card chart-card" },
    h("div", { class: "chart-head" },
      h("div", {}, h("h3", {}, cfg.title), cfg.sub ? h("p", { class: "csub" }, cfg.sub) : null),
      extraHead || legend),
    h("div", { class: "plot" }));
  card._cfg = cfg;
  return card;
}

// ---------- chart presets ----------
const C = { br: "var(--series-1)", avg: "var(--series-2)", env: "var(--series-3)" };
const nagariPct = (sr) => sr.games && sr.nagari ? sr.games.map((g, i) => (g ? (100 * sr.nagari[i]) / g : null)) : null;
const PRESETS = {
  nfsp: [
    { title: "정책 엔트로피", sub: "BR이 0 근처로 붙으면 정책이 결정론적으로 굳은 것", fmt: "smart",
      series: [["BR", "br_entropy", C.br], ["평균 정책", "average_entropy", C.avg]] },
    { title: "BR 정책 손실", sub: "−A · log π(a), 크게 음수로 발산하면 이상", series: [["BR", "br_policy", C.br]] },
    { title: "BR 가치 손실", sub: "smooth L1, 리턴 예측 오차", series: [["BR", "br_value", C.br]] },
    { title: "평균 정책 손실", sub: "BR 행동에 대한 교차 엔트로피", series: [["평균 정책", "average_loss", C.avg]] },
    { title: "평균 정책 top-1 일치율", sub: "리저버 샘플에서 BR 행동을 맞춘 비율", fmt: "pct01", series: [["평균 정책", "average_top1", C.avg]] },
    { title: "셀프플레이 처리량", sub: "초당 게임 수", fmt: "compact", series: [["games/s", "games_per_s", C.env]] },
    { title: "평균 |보상|", sub: "player 0 기준 게임당 점수 절댓값", series: [["|reward|", "mean_abs_reward0", C.env]] },
    { title: "나가리 비율", sub: "iteration 내 무승부 게임 비율", fmt: "pct", series: [["나가리", nagariPct, C.env]] },
  ],
  train50: [
    { title: "정책 엔트로피", series: [["정책", "entropy", C.br]] },
    { title: "정책 손실", series: [["정책", "policy", C.br]] },
    { title: "가치 손실", series: [["정책", "value", C.br]] },
    { title: "평균 |advantage|", series: [["정책", "mean_abs_advantage", C.br]] },
    { title: "셀프플레이 처리량", sub: "초당 게임 수", fmt: "compact", series: [["games/s", "games_per_s", C.env]] },
    { title: "나가리 비율", fmt: "pct", series: [["나가리", nagariPct, C.env]] },
  ],
};
function resolveSeries(preset, series) {
  const out = preset.series
    .map(([name, key, color]) => ({ name, color, values: typeof key === "function" ? key(series) : series[key] }))
    .filter((sr) => sr.values);
  return out.length ? { ...preset, x: series.iter, series: out } : null;
}

// ---------- health checks ----------
const SEV = { critical: ["var(--critical)", "심각"], serious: ["var(--serious)", "주의"], warning: ["var(--warning)", "경고"] };
function healthAlerts(run) {
  const L = run.latest || {}, out = [];
  if (run.kind === "nfsp") {
    if (L.br_entropy != null && L.br_entropy < 0.05)
      out.push(["serious", "BR 정책 엔트로피 붕괴", `최근 엔트로피 ${smart(L.br_entropy)}. BR이 거의 결정론적인 정책으로 굳어 새 행동을 시도하지 않습니다.`]);
    if (L.br_policy != null && L.br_policy < -10)
      out.push(["critical", "BR 정책 손실 발산", `최근 정책 손실 ${smart(L.br_policy)}. 리플레이의 오래된 행동 확률을 0으로 계속 밀어내고 있을 가능성이 큽니다.`]);
  } else if (L.entropy != null && L.entropy < 0.05) {
    out.push(["serious", "정책 엔트로피 붕괴", `최근 엔트로피 ${smart(L.entropy)}.`]);
  }
  if (run.status === "failed") out.push(["critical", "학습 실패", "로그에 Traceback 또는 오류가 기록되었습니다."]);
  if (run.status === "stopped") out.push(["warning", "로그 갱신 중단", "완료 표시 없이 로그 갱신이 멈췄습니다. 프로세스가 종료되었는지 확인하세요."]);
  return out;
}
function alertIcon() {
  const svg = s("svg", { width: 16, height: 16, viewBox: "0 0 16 16", "aria-hidden": "true" });
  svg.append(s("path", { d: "M8 1.5 15 14H1z", fill: "none", stroke: "currentColor", "stroke-width": 1.6, "stroke-linejoin": "round" }));
  svg.append(s("path", { d: "M8 6v3.5M8 11.6v.1", stroke: "currentColor", "stroke-width": 1.6, "stroke-linecap": "round" }));
  return svg;
}

// ---------- state ----------
const state = { tab: store.get("cugo.tab", "train"), runId: store.get("cugo.run", ""), runs: [], evals: [], run: null, now: Date.now() / 1000, explore: store.get("cugo.explore", "") };

function setTab(tab) {
  state.tab = tab; store.set("cugo.tab", tab);
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === tab)));
  $("#view-train").hidden = tab !== "train";
  $("#view-evals").hidden = tab !== "evals";
  if (tab === "train") drawCharts();
}
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => setTab(b.dataset.tab)));

function renderGpu(g) {
  const el = $("#gpu");
  if (!g) { el.replaceChildren(h("span", {}, "GPU 정보 없음")); return; }
  el.replaceChildren(
    h("span", { class: "name" }, g.name.replace("NVIDIA GeForce ", "")),
    h("span", { class: "meter", title: `사용률 ${g.util}%` }, h("i", { style: `width:${g.util}%` })),
    h("span", {}, `${g.util}%`),
    h("span", {}, `${(g.mem_used / 1024).toFixed(1)} / ${(g.mem_total / 1024).toFixed(1)} GB`),
    h("span", { class: "extra" }, `${g.temp}°C · ${Math.round(g.power)} W`));
}

function renderRuns() {
  const nav = $("#runs");
  nav.replaceChildren(h("h2", {}, "학습 로그"));
  if (!state.runs.length) { nav.append(h("div", { class: "empty" }, "build/ 아래에 학습 로그가 없습니다.")); return; }
  for (const r of state.runs) {
    const prog = r.target_iterations ? `${intFmt.format(r.last_iteration)} / ${intFmt.format(r.target_iterations)}` : `iter ${intFmt.format(r.last_iteration)}`;
    nav.append(h("button", { class: "run-item", "aria-current": String(r.id === state.runId), title: r.id, onclick: () => selectRun(r.id) },
      h("span", { class: "rn" }, r.name), statusBadge(r.status),
      h("span", { class: "rm" }, h("span", {}, r.kind === "nfsp" ? "NFSP" : "train50"), h("span", {}, prog), h("span", {}, ago(r.mtime, state.now)))));
  }
}

function tile(label, value, note) {
  return h("div", { class: "card tile" }, h("div", { class: "label" }, label), h("div", { class: "value" }, value), note ? h("div", { class: "note" }, note) : null);
}

function renderDetail() {
  const run = state.run, el = $("#detail");
  if (!run) { el.replaceChildren(h("div", { class: "card empty" }, "왼쪽에서 학습 로그를 선택하세요.")); return; }
  const target = state.runs.find((r) => r.id === run.id)?.target_iterations;
  const L = run.latest || {};
  const parts = [];

  parts.push(h("div", { class: "run-head" },
    h("h1", {}, run.name), statusBadge(run.status),
    h("span", { class: "tag" }, run.kind === "nfsp" ? "NFSP" : "train50"),
    h("div", { class: "run-sub" }, `build/${run.id} · 마지막 기록 ${ago(run.mtime, state.now)}`)));

  if (target) {
    const pct = Math.min(100, (100 * run.last_iteration) / target);
    parts.push(h("div", { class: "progress" },
      h("span", {}, `iter ${intFmt.format(run.last_iteration)} / ${intFmt.format(target)}`),
      h("div", { class: "bar" }, h("i", { style: `width:${pct}%` })), h("span", {}, pct.toFixed(0) + "%")));
  }

  const alerts = healthAlerts(run);
  if (alerts.length) parts.push(h("div", { class: "alerts" }, alerts.map(([sev, title, text]) =>
    h("div", { class: "alert", style: `--sev:${SEV[sev][0]}`, role: "status" }, alertIcon(),
      h("div", {}, h("b", {}, title), h("span", { class: "sev" }, SEV[sev][1])), h("p", {}, text)))));

  const rate = run.measured_seconds > 0 ? run.total_games / run.measured_seconds : null;
  parts.push(h("div", { class: "tiles" },
    tile("진행 iteration", intFmt.format(run.last_iteration), target ? `목표 ${intFmt.format(target)}` : null),
    tile("누적 게임", compactFmt.format(run.total_games), `${intFmt.format(run.total_games)}판`),
    tile("셀프플레이 속도", L.games_per_s != null ? compactFmt.format(L.games_per_s) : "–", "최근 iteration games/s"),
    tile("계측 학습 시간", duration(run.measured_seconds), rate ? `평균 ${compactFmt.format(rate)} games/s (학습 포함)` : null),
    run.kind === "nfsp" ? tile("BR 결정 비율", L.br_decision_pct != null ? L.br_decision_pct.toFixed(1) + "%" : "–", `anticipatory η = ${run.config?.anticipatory ?? "–"}`) : null));

  const presets = (PRESETS[run.kind] || []).map((p) => resolveSeries(p, run.series)).filter(Boolean);
  parts.push(h("div", { class: "charts" }, presets.map((p) => chartCard(p))));

  // Metric explorer: any logged numeric column.
  const keys = Object.keys(run.series).filter((k) => k !== "iter").sort();
  if (!keys.includes(state.explore)) state.explore = keys.includes("games_per_s") ? "games_per_s" : keys[0];
  const select = h("select", { "aria-label": "지표 선택", onchange: (e) => {
    state.explore = e.target.value; store.set("cugo.explore", state.explore);
    exploreCard._cfg = exploreCfg(); lineChart(exploreCard, exploreCard._cfg);
  } }, keys.map((k) => h("option", { value: k, selected: k === state.explore }, k)));
  const exploreCfg = () => ({ title: "지표 탐색", sub: "로그에 기록된 모든 수치 컬럼", x: run.series.iter, series: [{ name: state.explore, color: "var(--series-1)", values: run.series[state.explore] }] });
  const exploreCard = chartCard(exploreCfg(), h("div", { class: "explore" }, select));
  parts.push(exploreCard);

  const cfgEntries = Object.entries(run.config || {});
  const cps = [...(run.checkpoints || [])].sort((a, b) => (b.iteration ?? 0) - (a.iteration ?? 0));
  parts.push(h("div", { class: "split" },
    h("div", { class: "card" }, h("div", { class: "section-title", style: "margin-left:0" }, "설정"),
      cfgEntries.length ? h("dl", { class: "kv" }, cfgEntries.flatMap(([k, v]) => [h("dt", {}, k), h("dd", {}, typeof v === "number" ? smart(v) : v)]))
        : h("div", { class: "empty" }, "헤더 정보 없음")),
    h("div", { class: "card" }, h("div", { class: "section-title", style: "margin-left:0" }, `체크포인트 ${cps.length ? "· " + cps.length + "개" : ""}`),
      cps.length ? h("div", { class: "scroll" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "iteration"), h("th", {}, "파일"), h("th", { class: "num" }, "크기"), h("th", { class: "num" }, "저장"))),
        h("tbody", {}, cps.slice(0, 12).map((c) => h("tr", {},
          h("td", {}, c.iteration != null ? intFmt.format(c.iteration) : "–"), h("td", {}, c.file.split(/[\\/]/).pop()),
          h("td", { class: "num" }, (c.bytes / 1048576).toFixed(1) + " MB"), h("td", { class: "num" }, ago(c.mtime, state.now)))))))
        : h("div", { class: "empty" }, "저장된 체크포인트가 없습니다."))));

  el.replaceChildren(...parts);
  drawCharts();
}

function drawCharts() {
  if (state.tab !== "train") return;
  document.querySelectorAll("#detail .chart-card").forEach((card) => lineChart(card, card._cfg));
}

// ---------- evals ----------
function evalLabel(side) {
  if (!side) return "–";
  const pol = { average: "평균", br: "BR", legacy: "legacy" }[side.policy] || side.policy;
  return `${side.run} · ${pol} @${side.iteration ?? "?"}`;
}
function renderEvals() {
  const el = $("#view-evals");
  const rows = state.evals.filter((e) => e.pairs?.ci_low !== undefined);
  const intro = h("div", { class: "eval-intro" }, h("h1", {}, "페어 평가"),
    h("p", {}, "같은 딜을 좌석을 바꿔 두 번 두고, A 기준 판당 점수 차이를 잽니다. 막대는 95% 신뢰구간이며 0을 넘지 않으면 유의미한 차이입니다. 결과는 build/evals/*.log 에서 읽습니다."));
  if (!state.evals.length) {
    el.replaceChildren(intro, h("div", { class: "card empty" }, "평가 로그가 없습니다. eval50.py 출력을 build/evals/<이름>.log 로 저장하면 여기에 나타납니다."));
    return;
  }
  const lo = Math.min(0, ...rows.map((e) => e.pairs.ci_low)), hi = Math.max(0, ...rows.map((e) => e.pairs.ci_high));
  const sc = niceScale(lo, hi, 5);
  const P = (v) => ((v - sc.lo) / (sc.hi - sc.lo)) * 100;
  const verdict = (e) => e.pairs.ci_low > 0 ? ["A 우세", "var(--series-1)"] : e.pairs.ci_high < 0 ? ["B 우세", "var(--series-2)"] : ["유의차 없음", "var(--muted)"];

  const forest = h("div", { class: "forest" });
  for (const e of rows) {
    const [vt, vc] = verdict(e);
    forest.append(
      h("div", { class: "fl" }, h("b", {}, `${evalLabel(e.a)}`), h("small", {}, `vs ${evalLabel(e.b)}`)),
      h("div", { class: "ft", title: `${e.name}: ${smart(e.pairs.mean_score_A)} [${smart(e.pairs.ci_low)}, ${smart(e.pairs.ci_high)}]` },
        ...sc.ticks.map((t) => h("i", { class: t === 0 ? "zero" : "gridline", style: `left:${P(t)}%` })),
        h("i", { class: "whisker", style: `--c:${vc};left:${P(e.pairs.ci_low)}%;width:${P(e.pairs.ci_high) - P(e.pairs.ci_low)}%` }),
        h("i", { class: "pt", style: `--c:${vc};left:${P(e.pairs.mean_score_A)}%` })),
      h("div", { class: "fv" }, h("strong", {}, (e.pairs.mean_score_A > 0 ? "+" : "") + e.pairs.mean_score_A.toFixed(2)),
        h("small", {}, h("span", { class: "verdict", style: `--c:${vc}` }, h("i", {}), vt))));
  }
  forest.append(h("div", { class: "axis" }, sc.ticks.map((t) => h("span", { style: `left:${P(t)}%` }, (t > 0 ? "+" : "") + smart(t)))),
    h("div", { class: "axis-label" }, "A 기준 판당 평균 점수 차이 (점)"));

  const table = h("table", {},
    h("thead", {}, h("tr", {}, ["평가", "A", "B", "A 승률", "판당 점수차", "95% CI", "판정", "평가 쌍", "속도"].map((t, i) => h("th", { class: i >= 3 && i !== 6 ? "num" : null }, t)))),
    h("tbody", {}, state.evals.map((e) => {
      const ok = e.pairs?.ci_low !== undefined;
      const [vt, vc] = ok ? verdict(e) : [STATUS_LABEL[e.status] || e.status, "var(--muted)"];
      return h("tr", {},
        h("td", {}, e.name), h("td", {}, evalLabel(e.a)), h("td", {}, evalLabel(e.b)),
        h("td", { class: "num" }, e.result ? e.result.A_win_pct.toFixed(2) + "%" : "–"),
        h("td", { class: "num" }, ok ? (e.pairs.mean_score_A > 0 ? "+" : "") + e.pairs.mean_score_A.toFixed(3) : "–"),
        h("td", { class: "num" }, ok ? `${e.pairs.ci_low.toFixed(3)} ~ ${e.pairs.ci_high.toFixed(3)}` : "–"),
        h("td", {}, h("span", { class: "verdict", style: `--c:${vc}` }, h("i", {}), vt)),
        h("td", { class: "num" }, e.pairs ? String(e.pairs.evaluated).split("/")[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",") : "–"),
        h("td", { class: "num" }, e.engine ? compactFmt.format(e.engine.games_per_s) + "/s" : "–"));
    })));

  el.replaceChildren(intro,
    rows.length ? h("div", { class: "card" }, h("div", { class: "section-title", style: "margin-left:0" }, "판당 점수 차이"), forest) : null,
    h("div", { class: "card" }, h("div", { class: "section-title", style: "margin-left:0" }, "전체 결과"), h("div", { class: "scroll" }, table)));
}

// ---------- data ----------
async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status + " " + url);
  return r.json();
}
async function selectRun(id) {
  state.runId = id; store.set("cugo.run", id);
  renderRuns();
  await loadRun();
}
async function loadRun() {
  if (!state.runId) return;
  try { state.run = await getJSON("/api/run?id=" + encodeURIComponent(state.runId)); }
  catch { state.run = null; }
  renderDetail();
}
let lastSig = "";
async function refresh() {
  try {
    const st = await getJSON("/api/state");
    state.now = st.now; state.runs = st.runs; state.evals = st.evals;
    renderGpu(st.gpu);
    if (!state.runs.some((r) => r.id === state.runId)) state.runId = state.runs[0]?.id || "";
    renderRuns();
    const cur = state.runs.find((r) => r.id === state.runId);
    const sig = cur ? `${cur.id}|${cur.mtime}|${cur.status}` : "";
    if (sig !== lastSig) { lastSig = sig; await loadRun(); }
    else if (state.run) { // keep relative times fresh without re-fetching series
      const sub = document.querySelector(".run-sub");
      if (sub) sub.textContent = `build/${state.run.id} · 마지막 기록 ${ago(state.run.mtime, state.now)}`;
    }
    renderEvals();
    $("#updated").textContent = "5초마다 갱신 · " + new Date().toLocaleTimeString("ko-KR");
  } catch (err) {
    $("#updated").textContent = "서버 연결 끊김 · 재시도 중";
  }
}

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawCharts, 120); });
setTab(state.tab);
refresh();
setInterval(refresh, 5000);
</script>
